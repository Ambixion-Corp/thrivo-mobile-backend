name: Update Changelog

# After every merge to the default branch, record the new changes in the
# Unreleased section of CHANGELOG.md and open a pull request with the update.
# The workflow skips itself when the triggering commit was authored by the
# changelog bot, which prevents infinite merge -> PR -> merge loops.

on:
  push:
    branches:
      - main

concurrency:
  # Cancel any in-progress runs for the same workflow so we never queue up
  # overlapping changelog PRs.
  group: update-changelog
  cancel-in-progress: true

jobs:
  changelog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set repository context
        run: echo "GITHUB_REPOSITORY=${{ github.repository }}" >> "$GITHUB_ENV"

      - name: Generate changelog update
        run: node scripts/generate-changelog.js

      - name: Open pull request with changelog update
        id: open-pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'docs: update changelog'
          title: 'docs: update changelog'
          branch: feature/auto-update-changelog
          delete-branch: true
          branch-suffix: timestamp
          labels: documentation
          reviewers: navinkumarrai